<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 760" style="max-width:1000px;background:#fff" font-family="Helvetica, Arial, sans-serif" font-size="16" role="img" aria-label="On one machine the path opens. Deployed, the browser cannot reach the file on the server container.">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker><marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d33"/></marker></defs>
<rect x="20" y="20" width="960" height="260" rx="12" fill="#eef5ff" stroke="#5b8def" stroke-width="2"/>
<text x="40" y="52" text-anchor="start" font-size="18" font-weight="bold" fill="#222">On your laptop: one machine. The path works.</text>
<rect x="50" y="80" width="250" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="175.0" y="126.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Host application</text>
<text x="175.0" y="148.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">on your computer</text>
<rect x="650" y="80" width="270" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="785.0" y="126.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Server process</text>
<text x="785.0" y="148.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">python server.py</text>
<polyline points="300,115 648,115" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<text x="475" y="107" text-anchor="middle" font-size="14" font-weight="normal" fill="#222">tools/call</text>
<polyline points="650,150 302,150" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<text x="475" y="142" text-anchor="middle" font-size="14" font-weight="normal" fill="#222">"path": "/tmp/effis/map.png"</text>
<rect x="650" y="200" width="270" height="64" rx="8" fill="#fffbe0" stroke="#c9a400" stroke-width="2"/>
<text x="785.0" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">map.png</text>
<text x="785.0" y="248" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">/tmp/effis/, same computer</text>
<polyline points="785,180 785,198" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="175,180 175,232 648,232" fill="none" stroke="#c9a400" stroke-width="2" marker-end="url(#arf)" stroke-dasharray="7 5"/>
<text x="475" y="224" text-anchor="middle" font-size="14" font-weight="normal" fill="#222">you open the path</text>
<rect x="20" y="310" width="960" height="430" rx="12" fill="#fff7ec" stroke="#e8913a" stroke-width="2"/>
<text x="40" y="342" text-anchor="start" font-size="18" font-weight="bold" fill="#222">Deployed: three machines. The path fails.</text>
<rect x="40" y="365" width="270" height="355" rx="12" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
<text x="175.0" y="393" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Machine A</text>
<text x="175.0" y="415" text-anchor="middle" font-size="14" font-weight="normal" fill="#555">the user's browser</text>
<rect x="365" y="365" width="270" height="355" rx="12" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
<text x="500.0" y="393" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Machine B</text>
<text x="500.0" y="415" text-anchor="middle" font-size="14" font-weight="normal" fill="#555">EVE backend</text>
<rect x="690" y="365" width="270" height="355" rx="12" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
<text x="825.0" y="393" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Machine C</text>
<text x="825.0" y="415" text-anchor="middle" font-size="14" font-weight="normal" fill="#555">MCP server container</text>
<rect x="75" y="435" width="200" height="80" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="175.0" y="481.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Chat</text>
<rect x="400" y="435" width="200" height="80" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="500.0" y="481.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Agent</text>
<rect x="725" y="435" width="200" height="80" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="825.0" y="471.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Server</text>
<text x="825.0" y="493.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">same code</text>
<rect x="725" y="560" width="200" height="64" rx="8" fill="#fffbe0" stroke="#c9a400" stroke-width="2"/>
<text x="825.0" y="588" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">map.png</text>
<text x="825.0" y="608" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">/tmp/effis/, machine C</text>
<polyline points="825,515 825,558" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="725,460 602,460" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<rect x="628.9" y="436" width="68.2" height="20" fill="#fff"/>
<text x="663" y="450" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the path</text>
<polyline points="400,490 277,490" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<rect x="303.9" y="466" width="68.2" height="20" fill="#fff"/>
<text x="338" y="480" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the path</text>
<polyline points="175,515 175,580 723,580" fill="none" stroke="#d33" stroke-width="2" marker-end="url(#arx)" stroke-dasharray="7 5"/>
<rect x="246.8" y="557" width="182.5" height="21" fill="#fff"/>
<text x="338" y="572" text-anchor="middle" font-size="14" font-weight="normal" fill="#d33">browser cannot load it</text>
<polyline points="500,515 500,610 723,610" fill="none" stroke="#d33" stroke-width="2" marker-end="url(#arx)" stroke-dasharray="7 5"/>
<rect x="528.6" y="617" width="166.8" height="21" fill="#fff"/>
<text x="612" y="632" text-anchor="middle" font-size="14" font-weight="normal" fill="#d33">agent cannot read it</text>
<text x="500" y="672" text-anchor="middle" font-size="14" font-weight="normal" fill="#444">EVE received text only.</text>
<text x="500" y="690" text-anchor="middle" font-size="14" font-weight="normal" fill="#444">It has no bytes to store.</text>
<text x="825" y="672" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">The container may stop</text>
<text x="825" y="689" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">and take the file with it.</text>
</svg>