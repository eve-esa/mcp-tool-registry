<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 520" style="max-width:1000px;background:#fff" font-family="Helvetica, Arial, sans-serif" font-size="16" role="img" aria-label="The middleware attaches the file. EVE's interceptor writes it to an /artifacts path that the agent reads and the browser loads.">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a400"/></marker><marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d33"/></marker></defs>
<rect x="20" y="20" width="960" height="480" rx="12" fill="#eefaf2" stroke="#3aa76d" stroke-width="2"/>
<text x="40" y="52" text-anchor="start" font-size="18" font-weight="bold" fill="#222">Deployed with the launcher and EVE's interceptor. The same code works.</text>
<rect x="40" y="75" width="270" height="405" rx="12" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
<text x="175.0" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Machine A</text>
<text x="175.0" y="125" text-anchor="middle" font-size="14" font-weight="normal" fill="#555">the user's browser</text>
<rect x="365" y="75" width="270" height="405" rx="12" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
<text x="500.0" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Machine B</text>
<text x="500.0" y="125" text-anchor="middle" font-size="14" font-weight="normal" fill="#555">EVE backend</text>
<rect x="690" y="75" width="270" height="405" rx="12" fill="#fff" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
<text x="825.0" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Machine C</text>
<text x="825.0" y="125" text-anchor="middle" font-size="14" font-weight="normal" fill="#555">MCP server container</text>
<rect x="75" y="145" width="200" height="80" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="175.0" y="191.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Chat</text>
<rect x="400" y="145" width="200" height="80" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="500.0" y="181.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">ArtifactInterceptor</text>
<text x="500.0" y="203.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">bytes to a file</text>
<rect x="400" y="270" width="200" height="64" rx="8" fill="#fffbe0" stroke="#c9a400" stroke-width="2"/>
<text x="500.0" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">map.png</text>
<text x="500.0" y="318" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">/artifacts/{id}/map.png</text>
<rect x="400" y="385" width="200" height="64" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="500.0" y="423.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Agent</text>
<rect x="725" y="145" width="200" height="80" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="825.0" y="181.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">OutputFilesMiddleware</text>
<text x="825.0" y="203.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">path to bytes</text>
<rect x="725" y="270" width="200" height="64" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="825.0" y="298.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Server</text>
<text x="825.0" y="320.0" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">your code, unchanged</text>
<rect x="725" y="385" width="200" height="64" rx="8" fill="#fffbe0" stroke="#c9a400" stroke-width="2"/>
<text x="825.0" y="413" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">map.png</text>
<text x="825.0" y="433" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">/tmp/effis/</text>
<polyline points="825,334 825,383" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<polyline points="825,270 825,227" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<text x="838" y="253" text-anchor="start" font-size="13" font-weight="normal" fill="#222">the path</text>
<polyline points="725,170 602,170" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<rect x="625.2" y="146" width="75.5" height="20" fill="#fff"/>
<text x="663" y="160" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">the bytes</text>
<polyline points="500,225 500,268" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<text x="512" y="252" text-anchor="start" font-size="13" font-weight="normal" fill="#222">writes</text>
<polyline points="500,385 500,336" fill="none" stroke="#c9a400" stroke-width="2" marker-end="url(#arf)" stroke-dasharray="7 5"/>
<text x="512" y="365" text-anchor="start" font-size="13" font-weight="normal" fill="#222">reads the path</text>
<polyline points="400,417 140,417 140,227" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
<rect x="188.6" y="394" width="162.9" height="20" fill="#fff"/>
<text x="270" y="408" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">answer links the path</text>
<polyline points="210,225 210,302 398,302" fill="none" stroke="#c9a400" stroke-width="2" marker-end="url(#arf)" stroke-dasharray="7 5"/>
<rect x="248.0" y="279" width="111.9" height="20" fill="#fff"/>
<text x="304" y="293" text-anchor="middle" font-size="13" font-weight="normal" fill="#222">loads the file</text>
</svg>