name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Detect scope and run structural validation ───────────────────────
  validate:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.detect.outputs.server }}
      has_server: ${{ steps.detect.outputs.has_server }}
      has_infra: ${{ steps.detect.outputs.has_infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Detect changed files
        id: detect
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1

          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE_REF"...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          SERVERS=$(echo "$CHANGED" | grep '^servers/' | cut -d/ -f2 | sort -u || true)
          SERVER_COUNT=$(echo "$SERVERS" | grep -c . || true)

          if [ "$SERVER_COUNT" -eq 1 ]; then
            echo "server=$SERVERS" >> "$GITHUB_OUTPUT"
            echo "has_server=true" >> "$GITHUB_OUTPUT"
          elif [ "$SERVER_COUNT" -eq 0 ]; then
            echo "server=" >> "$GITHUB_OUTPUT"
            echo "has_server=false" >> "$GITHUB_OUTPUT"
          else
            echo "server=" >> "$GITHUB_OUTPUT"
            echo "has_server=true" >> "$GITHUB_OUTPUT"
          fi

          INFRA=$(echo "$CHANGED" | grep -E '^(shared/|scripts/|\.github/)' || true)
          if [ -n "$INFRA" ]; then
            echo "has_infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_infra=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run structural validation
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          python scripts/validate_pr.py --base-ref "$BASE_REF"

  # ─── Lint with ruff ───────────────────────────────────────────────────
  lint:
    needs: validate
    if: needs.validate.outputs.has_server == 'true' && needs.validate.outputs.server != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Lint server
        run: ruff check servers/${{ needs.validate.outputs.server }}/

  # ─── Docker build smoke test ──────────────────────────────────────────
  docker-build:
    needs: validate
    if: needs.validate.outputs.has_server == 'true' && needs.validate.outputs.server != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build \
            --platform linux/amd64 \
            -f shared/Dockerfile \
            "servers/${{ needs.validate.outputs.server }}"

  # ─── Flag infrastructure changes for maintainer review ────────────────
  infra-review:
    needs: validate
    if: needs.validate.outputs.has_infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Add infra-review label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['infra-review']
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ This PR modifies shared infrastructure (`shared/`, `scripts/`, or `.github/`). A maintainer must review these changes before merge.'
            });
