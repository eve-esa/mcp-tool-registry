name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Detect which servers changed (always succeeds) ──────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.detect.outputs.servers }}
      has_server: ${{ steps.detect.outputs.has_server }}
      has_infra: ${{ steps.detect.outputs.has_infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1

          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE_REF"...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          SERVERS=$(echo "$CHANGED" | grep '^servers/' | cut -d/ -f2 | sort -u || true)
          SERVER_COUNT=$(echo "$SERVERS" | grep -c . || true)

          if [ "$SERVER_COUNT" -gt 0 ]; then
            JSON=$(echo "$SERVERS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "servers=$JSON" >> "$GITHUB_OUTPUT"
            echo "has_server=true" >> "$GITHUB_OUTPUT"
          else
            echo "servers=[]" >> "$GITHUB_OUTPUT"
            echo "has_server=false" >> "$GITHUB_OUTPUT"
          fi

          INFRA=$(echo "$CHANGED" | grep -E '^(shared/|scripts/|\.github/)' || true)
          if [ -n "$INFRA" ]; then
            echo "has_infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_infra=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Structural validation (runs independently) ─────────────────────
  validate-structure:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install server dependencies
        run: |
          for server in ${{ needs.detect-changes.outputs.servers }}; do
            pip install -r "servers/$server/requirements.txt"
          done

      - name: Run structural validation
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          python scripts/validate_pr.py --base-ref "$BASE_REF"

  # ─── Lint with ruff (runs independently) ─────────────────────────────
  lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_server == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: ${{ fromJson(needs.detect-changes.outputs.servers) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Lint server (${{ matrix.server }})
        run: ruff check servers/${{ matrix.server }}/

  # ─── Docker build smoke test (runs independently) ────────────────────
  docker-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_server == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: ${{ fromJson(needs.detect-changes.outputs.servers) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.server }})
        run: |
          docker build \
            --platform linux/amd64 \
            -f shared/Dockerfile \
            "servers/${{ matrix.server }}"

  # ─── Require maintainer approval when shared infra is touched ─────────
  flag-infra-changes:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Label PR and request maintainer review
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['requires-maintainer-review']
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ This PR modifies shared infrastructure (`shared/`, `scripts/`, or `.github/`). A maintainer must review these changes before merge.'
            });
