name: Deploy MCP servers to AgentCore

on:
  push:
    branches: [main]
    paths:
      - "servers/**"
      - "shared/**"
  workflow_dispatch:
    inputs:
      server:
        description: "Server folder name to deploy (e.g. effis)"
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  # ─── Detect which server folders changed ───────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.detect.outputs.servers }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Detect changed MCP servers
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVERS='["${{ github.event.inputs.server }}"]'
            echo "Manual trigger: deploying ${{ github.event.inputs.server }}"
          else
            SERVERS=$(python scripts/detect_changed.py)
          fi
          echo "servers=$SERVERS" >> "$GITHUB_OUTPUT"
          if [ "$SERVERS" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No MCP server changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed servers: $SERVERS"
          fi

  # ─── Build and deploy each changed server ──────────────────────────────
  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(needs.detect-changes.outputs.servers) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deploy dependencies
        run: pip install boto3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-eve-tools-agentcore-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Inject runtime secrets from GitHub Secrets into .env file.
      # Reads ${VAR_NAME} placeholders from the server's .env.template
      # and resolves each from the full secrets context automatically.
      # Adding a new server with new secrets requires NO workflow changes —
      # just add the GitHub Secrets and reference them in .env.template.
      - name: Inject runtime secrets
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
          TEMPLATE_PATH: servers/${{ matrix.server }}/.env.template
          TARGET_PATH: servers/${{ matrix.server }}/.env
        run: |
          if [ -f "$TEMPLATE_PATH" ]; then
            python3 -c '
          import json, os, re
          secrets = json.loads(os.environ["ALL_SECRETS"])
          template = open(os.environ["TEMPLATE_PATH"]).read()
          def replace(m):
              key = m.group(1)
              val = secrets.get(key, "")
              if not val:
                  print(f"  WARNING: secret {key} not found in GitHub Secrets")
              return val
          result = re.sub(r"\$\{(\w+)\}", replace, template)
          open(os.environ["TARGET_PATH"], "w").write(result)
          '
            echo "Created .env for ${{ matrix.server }} from template"
          else
            echo "No .env.template found — skipping secret injection"
          fi

      - name: Deploy ${{ matrix.server }}
        run: |
          python scripts/deploy_server.py \
            --server-name "${{ matrix.server }}" \
            --region "${{ env.AWS_REGION }}" \
            --account-id "${{ secrets.AWS_ACCOUNT_ID }}" \
            --execution-role-arn "${{ secrets.AGENTCORE_EXECUTION_ROLE_ARN }}" \
            --cognito-discovery-url "${{ secrets.COGNITO_DISCOVERY_URL }}" \
            --cognito-client-id "${{ secrets.COGNITO_CLIENT_ID }}"
